{% extends 'base.html' %}
{% block header_title %}➕ Nuevo pedido{% endblock %}
{% block content %}
  <form class="form" method="post">
    <label>Cliente</label>
    <select name="cliente_id">
      <option value="">-- Sin asignar --</option>
      {% for c in clientes %}
        <option value="{{ c.id }}">{{ c.nombre }}</option>
      {% endfor %}
    </select>

    <label>Notas</label>
    <textarea name="notas" rows="2"></textarea>

    <div class="section-title">🧾 Fundas del pedido</div>
    <div class="list-card">
      <label>Descripción</label>
      <input name="descripcion" placeholder="Ej: Funda floral A5">
      <label>Producto del stock (opcional)</label>
      <select name="producto_id">
        <option value="">-- ninguno --</option>
        {% for p in productos %}
          <option value="{{ p.id }}">{{ p.nombre }} ({{ p.cantidad }} uds)</option>
        {% endfor %}
      </select>
      <label>Cantidad</label>
      <input name="cantidad" type="number" value="1">
      <label>Precio unitario (€)</label>
      <input name="precio" type="number" step="0.01" value="0">
    </div>

    <button type="submit">✅ Crear pedido</button>
  </form>
{% endblock %}
