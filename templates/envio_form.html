{% extends 'base.html' %}
{% block header_title %}{{ '✏️ Editar envío' if envio else '➕ Nuevo método de envío' }}{% endblock %}
{% block content %}
  <form class="form" method="post">
    <label>Nombre</label>
    <input name="nombre" required value="{{ envio.nombre if envio else '' }}" placeholder="Ej: Vinted, Correos, Recogida en mano...">

    <label>Tarifa (€)</label>
    <input name="precio" type="number" step="0.01" value="{{ envio.precio if envio else 0 }}">

    {% if envio %}
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
        <input type="checkbox" name="activo" value="1" style="width:auto;" {{ 'checked' if envio.activo else '' }}>
        Activo (disponible al crear pedidos)
      </label>
    {% endif %}

    <button type="submit">{{ 'Guardar cambios' if envio else 'Añadir' }}</button>
    <button type="button" class="secondary" onclick="window.location.href='{{ url_for('envios_list') }}'">Cancelar</button>
  </form>
{% endblock %}
